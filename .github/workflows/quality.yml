name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run leak-scan
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run --ignore-scripts

  lab:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - run: echo "lab job stub; Task 9 fills this in"
